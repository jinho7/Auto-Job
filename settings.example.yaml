# Auto-Job 설정 틀
# `autojob init`을 실행하면 settings.yaml로 복사됩니다. settings.yaml은 git에 올라가지 않습니다.

# ─── AI 연결 ─────────────────────────────────────────────
llm:
  backend: claude-cli          # claude-cli (Claude Code) | codex-cli (Codex CLI) | anthropic-api | openai-api
  model: ""                    # 기본 모델. 비우면 방식별 기본. 기능별 모델(apply.model 등)이 있으면 그것을 먼저 씀
  effort: ""                   # 기본 추론 성능: low | medium | high | xhigh | max (비우면 연결의 기본)
  connections: []              # 여러 AI 연결 (설정 화면 → AI 연결). 위에서부터 쓰고 한도에 걸리면 다음으로 넘어감
  cooldown_minutes: 60         # 한도에 걸린 연결을 다시 쓰기까지 기다릴 시간 (풀리는 시각을 모를 때)
  stall_minutes: 20            # 이 시간 동안 아무 반응이 없으면 다음 연결로 넘어갑니다 (0 이면 끄기)

# ─── 브라우저 ─────────────────────────────────────────────
browser:
  driver: aside                # aside | chrome
  aside:
    app: /Applications/Aside.app
    cdp_port: 9222
    profile_dir: ~/.autojob/browser-profiles/aside   # 자동화 전용 프로필 (평소 프로필과 분리)
  chrome:
    app: /Applications/Google Chrome.app
    cdp_port: 9223
    profile_dir: ~/.autojob/browser-profiles/chrome

  # 제출 차단 가드. 버튼 문구에서 공백을 없애고 소문자로 바꾼 뒤 "포함" 여부로 판단합니다.
  guard:
    always_block:              # 항상 차단
      - 제출
      - 작성완료
      - 지원완료
      - 최종지원
      - 접수하기
      - 접수완료
      - 지원서접수
      - submit
    block_when_armed:          # 지원서 입력 단계(armed)부터 차단. 그 전에는 지원을 시작하는 버튼이라 허용
      - 지원하기
      - apply
      - finish
    allow_exact:               # 문구가 정확히 이것이면 허용 (위 목록보다 우선)
      - 임시저장
      - 임시저장하기
      - 중간저장
      - 저장
      - 저장하기

# ─── Notion ──────────────────────────────────────────────
notion:
  database_id: ""              # `autojob settings` → Notion 에서 DB 링크로 지정
  data_source_id: ""
  fields:                      # 내 DB의 실제 속성 이름
    company: 회사명
    roles: 직무
    employment: 채용 분류
    deadline: 지원 마감 시간
    status: 제출 상태
    result: 합불 여부
    note: 참고 키워드
    link: 지원 링크
    result_date: 서류 합격 발표 일자
    files: 제출 자료
  employment_options:          # 표준 이름 → 내 DB 옵션 이름
    정규직: 정규직
    채용연계형인턴: 채용 연계/전환형 인턴
    체험형인턴: 체험형 인턴
    계약직: 계약직
  status_options:
    priority: 작성중           # 기업 구분 priority=true 일 때 등록 상태
    default: 제출전
    after_apply: 작성중        # apply 완료 후 변경할 상태
  result_default: 대기
  use_db_template: true        # DB 에 기본 템플릿이 있으면 그 템플릿으로 페이지를 만든다
  page_sections:               # 템플릿이 없을 때 페이지 본문에 넣을 제목 (지원서 작성 후 이 제목 아래에 내용을 채운다)
    - 절차
    - 회사/조직 소개
    - 지원 직무
    - 자기소개서 질문
    - 프로젝트 및 동아리 작성 여부
    - 제출 자료 여부
  timezone_offset: "+09:00"    # 마감 시간의 시간대
  role_rules: {}               # 직무 태그 → 공고에 이 단어가 있으면 태그. 적지 않은 태그는 태그 이름의 단어로 판단
  section_map:                 # 지원서 작성 후 채울 페이지 본문 제목 (내 템플릿의 제목과 같게)
    procedure: 절차
    company: 회사/조직 소개
    role: 지원 직무
    essays: 자기소개서 질문
    projects: 프로젝트 및 동아리 작성 여부
    documents: 제출 자료 여부

# ─── 공고 수집 ────────────────────────────────────────────
collect:
  sources:                     # 지원 현황은 `autojob collect --help` / 설정 화면 참고
    saramin: true              # 사람인: 검색 결과 + 상세 (robots.txt 허용 범위)
    jasoseol: true             # 자소설닷컴: 자동화 브라우저로 채용 달력 (대기업 공채 위주)
    jobkorea: true             # 잡코리아: 채용정보 목록 + 상세 (robots.txt 허용 범위, 검색 페이지는 쓰지 않음)
    catch: true                # 캐치: 채용공고 목록 + 상세 (robots.txt 허용 범위)
    wanted: false              # 원티드: robots.txt 를 읽을 수 있을 때만 수집 (지금은 사이트가 robots.txt 요청을 막고 있음)
    incruit: false             # robots.txt 가 모든 자동 접근을 막아 수집하지 않음
  keywords: []                 # 선택: 내 정보·연결 폴더에서 AI가 만든 검색어에 추가할 검색어
  employment_types:            # 수집할 고용형태
    - 신입
    - 인턴
    - 채용연계형 인턴
    - 체험형 인턴
    - 계약직
  exclude_experienced: true    # 경력직 제외 ([신입 및 경력]은 포함)
  lookahead_days: 60           # 마감이 오늘부터 이 기간 안인 공고만 (상시 채용은 포함)
  max_per_keyword: 100         # 사람인 키워드당 최대 공고 수
  request_delay_ms: 1500       # 같은 사이트에 보내는 요청 사이 간격 (사이트 부하 방지)
  jasoseol:
    duty_groups: []            # 자소설닷컴 직무 분류. 비우면 검색 키워드로 직무명을 거른다
  jobkorea:
    duty_categories: []        # 잡코리아 직무 대분류 이름. 비우면 전체 직무에서 검색 키워드로 찾는다
  wanted:
    job_group_ids: []          # 원티드 직군 번호. 비우면 전체 직군에서 검색 키워드로 거른다
  link_search:                 # 지원 페이지를 못 찾은 공고는 AI 가 웹 검색으로 찾는다 (못 찾으면 등록 안 함)
    enabled: true
    model: ""                  # 비우면 AI 연결의 기본 모델
    max_per_run: 20            # 한 번 수집할 때 AI 로 찾을 최대 공고 수 (비용 제한)
    batch_size: 5              # AI 한 번에 맡길 공고 수
    reject_domains:            # 지원 페이지로 인정하지 않을 사이트
      - cafe.naver.com
      - blog.naver.com
      - tistory.com
      - velog.io
      - brunch.co.kr
      - dcinside.com
      - instagram.com
      - facebook.com
      - youtube.com
      - google.com
      - namu.wiki
  ai_roles:
    mode: fill_empty           # off: 규칙만 / fill_empty: 규칙으로 못 단 공고만 AI 가 / review: 모든 공고를 AI 가 다시 봄
    model: ""
  require_role: false          # 직무 태그를 하나도 달지 못한 공고는 등록하지 않음

# ─── 지원서 작성 ───────────────────────────────────────────
apply:
  extra_rules: []              # 지원서 전체 에이전트에게 줄 사용자 규칙 (prompts/application-agent.md)
  model: ""                    # 비우면 AI 연결의 기본 모델
  effort: ""                   # 추론 성능 (비우면 AI 연결의 기본)
  max_parallel: 4              # 설정 화면에서 여러 지원서를 맡길 때 동시에 진행할 개수 (1~8)
  save_draft: true             # 다 쓰고 나서 임시저장 버튼을 누른다 (최종 제출은 절대 누르지 않음)
  save_buttons:                # 이전 설정 호환용 (현재는 AI가 화면에서 저장 버튼을 선택)
    - 임시저장
    - 임시 저장
    - 중간저장
    - 저장하기
    - 저장
  update_notion: true          # Notion 공고 페이지 본문을 채우고 제출 상태를 바꾼다

# ─── 자기소개서 문체 ───────────────────────────────────────
essay:
  tone: 습니다                 # 문장 끝맺음 (습니다 / 해요 ...)
  subtitle: true               # 문단마다 내용이 드러나는 [소제목] 달기
  forbid_middle_dot: false     # 단어 나열에 가운뎃점(·) 쓰지 않기
  blind: true                  # 블라인드 규정 지키기 (실명, 학교명, 특정 단체명 쓰지 않기)
  banned_phrases: []           # 쓰지 않을 표현 목록
  model: ""                    # 자기소개서를 쓸 AI 모델. 비우면 AI 연결의 기본 모델
  effort: ""                   # 추론 성능 (비우면 AI 연결의 기본)
  max_revisions: 1             # 검토 후 고쳐 쓰기 최대 횟수 (0~3)

# ─── 기업 구분 (자소설닷컴 달력 필터처럼 켜고 끄기) ─────────
# include: 수집에 포함할지 / priority: 등록 시 status_options.priority 상태로 둘지
# companies / name_keywords: 이 구분으로 볼 회사명 / 회사명에 들어가는 단어.
#   적지 않으면 기본 목록(유명IT, 금융, 공기업, 대기업)을 쓰고, 설정 화면에서 고칠 수 있다.
# 사이트가 알려주는 기업 규모(자소설 기업분류, 사람인 기업형태)도 함께 쓴다.
# 여러 구분에 걸리면: 하나라도 포함이면 포함, 하나라도 작성중이면 작성중.
company_types:
  대기업:   { include: true,  priority: true  }
  유명IT:   { include: true,  priority: true  }
  금융:     { include: true,  priority: false }
  공기업:   { include: true,  priority: false }
  중견:     { include: true,  priority: false }
  외국계:   { include: true,  priority: false }
  스타트업: { include: true,  priority: false }
  중소:     { include: false, priority: false }

overrides:
  always_include: []           # 회사명
  always_exclude: []
  priority: []
